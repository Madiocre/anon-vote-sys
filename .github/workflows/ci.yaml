name: CI

# Pull requests and non-main branches. Never touches production.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The offline gate. Runs for every PR including forks, since it needs no secrets.
  check:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than "latest": bun.lock is lockfileVersion 2, written
          # by Bun 1.4, and --frozen-lockfile turns a resolver mismatch into a
          # failed build.
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      # Generates worker-configuration.d.ts. Kept as its own step so a failure
      # here is legible, but it is no longer load-bearing — `typecheck` runs it
      # too (see below), and both runs are idempotent.
      - name: Generate Worker types
        run: bun run --cwd apps/web types

      # `bun run check` is typecheck + 87 server tests, and apps/web's typecheck
      # is now self-sufficient:
      #
      #   wrangler types && astro sync && tsc --noEmit && tsc -p tsconfig.test.json
      #
      # Both codegen steps are there because BOTH outputs are gitignored, so a
      # fresh clone has neither and tsc fails on things that look like broken
      # imports rather than missing codegen:
      #
      #   * wrangler types -> worker-configuration.d.ts, which declares
      #     D1Database, DurableObjectNamespace, RateLimit, ExecutionContext and
      #     the cloudflare:workers module. Missing it = 19 errors.
      #   * astro sync -> .astro/integrations/_astrojs_cloudflare/cloudflare.d.ts,
      #     a one-line `/// <reference types="@astrojs/cloudflare/types.d.ts" />`
      #     that augments App.Locals with `cfContext`. Missing it = the
      #     "Property 'cfContext' does not exist on type 'Locals'" failure that
      #     broke this workflow on its first real run.
      #
      # Putting them inside the script rather than adding workflow steps means a
      # fresh local clone behaves like CI, and a future workflow cannot forget
      # them. Verified by deleting .astro/, dist/ and worker-configuration.d.ts
      # and running `bun run check` alone: exit 0.
      #
      # NOTE: this is unrelated to .astro files being untypechecked (the Build
      # step below). That one is a real TypeScript 7 limitation with no fix yet.
      - name: test
        run: bun run check

      # The only gate on .astro files: astro check cannot run against - TODO add a test for this after astro adapts the new typescript 7
      # TypeScript 7, so the build is what catches template and import errors.
      - name: Build
        run: bun run --cwd apps/web build

  # Deploy the branch to staging and smoke test it, so a change is seen running
  # against real bindings before it is merged — not after it reaches production.
  #
  # Skipped for forks: pull_request from a fork cannot read repository secrets,
  # so this would fail with an empty API token rather than a useful error.
  # Skipped on the shared staging Worker means concurrent PRs overwrite each
  # other; fine for solo work, revisit if that stops being true.
  staging:
    name: Deploy to staging and smoke test
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Worker types
        run: bun run --cwd apps/web types

      # CLOUDFLARE_ENV is set by this script. `wrangler deploy --env staging`
      # does NOT work here — see docs/ci-pipeline.md.
      - name: Build for staging
        run: bun run --cwd apps/web build:staging

      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: bun
          command: deploy

      - name: Smoke test
        run: bun run scripts/smoke.ts "${{ steps.deploy.outputs.deployment-url }}"

      - name: Report
        run: echo "Staging deployment - ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
